[project]
name = "agent-notes"
version = "1.0.0"
description = "Unified pgvector-backed CLI for agent notes (breadcrumbs, memories, reflections) shared across the sf2 constellation"
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3.1",
    "psycopg-pool>=3.2",
    "sentence-transformers>=3.0",
    "numpy>=1.24",
    "einops>=0.7",
    "fastapi>=0.100",
    "uvicorn>=0.20",
    "cryptography>=42.0",
    "platformdirs>=4.0",
    "regista>=0.4.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "testcontainers[postgres]>=4.0",
]

[project.scripts]
agent-notes             = "agent_notes.cli:main"
agent-notes-setup       = "agent_notes.scripts.setup_db:main"
agent-notes-migrate     = "agent_notes.scripts.migrate:main"
agent-notes-import-reflections = "agent_notes.scripts.import_reflections:main"
agent-notes-doctor      = "agent_notes.scripts.doctor:main"
agent-notes-bridge       = "agent_notes.bridge:main"
agent-notes-trigger-loop = "agent_notes.trigger_loop:main"
agent-notes-web          = "agent_notes.web.app:main"


[tool.uv.sources]
# regista is a local sibling repo in the sf2 constellation, not published to
# any package index. This mapping lets `uv lock` / `uv run` resolve it from the
# checked-out source so the Makefile targets (make lint, make test) work without
# a pre-built venv. Assumes the constellation layout (repos are siblings under a
# common parent, e.g. /projects/{regista,agent-notes}).
regista = { path = "../regista", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_notes"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "postgres: requires a real Postgres instance (regista pg15 test DB; set REGISTA_TEST_DSN)",
]
