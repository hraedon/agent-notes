[project]
name = "agent-notes-mcp"
version = "0.1.0"
description = "Unified pgvector-backed MCP server for agent notes (breadcrumbs, memories, reflections) shared across the sf2 constellation"
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3.1",
    "psycopg-pool>=3.2",
    "sentence-transformers>=3.0",
    "numpy>=1.24",
    "einops>=0.7",
    "fastapi>=0.100",
    "uvicorn>=0.20",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "testcontainers[postgres]>=4.0",
]

[project.scripts]
# One generic binary; per-kind names are thin shims that call serve(kinds=[...])
# so harness configs (Claude/OpenCode/Gemini) stay ergonomic. Invoke
# `agent-notes serve --kinds bc,memory` to mount multiple kinds in one process
# (decision 12 — omnibus mode is the same code path).
agent-notes             = "agent_notes.cli:main"
agent-notes-breadcrumbs = "agent_notes.cli:main_breadcrumbs"
agent-notes-memory      = "agent_notes.cli:main_memory"
agent-notes-search      = "agent_notes.cli:main_search"
agent-notes-setup       = "agent_notes.scripts.setup_db:main"
agent-notes-migrate     = "agent_notes.scripts.migrate:main"
agent-notes-import-reflections = "agent_notes.scripts.import_reflections:main"
agent-notes-doctor      = "agent_notes.scripts.doctor:main"
agent-notes-omnibus    = "agent_notes.cli:main_omnibus"
agent-notes-web        = "agent_notes.web.app:main"
# agent-notes-reflections added only if Phase 3.6 spike (decision 25) concludes
# memories don't suffice for the reflection use case.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_notes"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
