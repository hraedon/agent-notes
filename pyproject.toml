[project]
name = "agent-notes-hraedon"
version = "1.0.0"
description = "Unified pgvector-backed CLI for agent notes (breadcrumbs, memories, reflections) shared across the sf2 constellation"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.1",
    "psycopg-pool>=3.2",
    "sentence-transformers>=3.0",
    "numpy>=1.24",
    "einops>=0.7",
    "fastapi>=0.100",
    "uvicorn>=0.20",
    "cryptography>=42.0",
    "platformdirs>=4.0",
    "regista-hraedon>=0.5.1",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "testcontainers[postgres]>=4.0",
    # CLI contract v1 conformance kit (Plan 018 WI-2), a normal pinned version
    # dependency (Plan 019 B1). Previously a git+SHA direct reference installed
    # by a separate CI step — which PyPI forbids in uploaded metadata; now a
    # published wheel, so it lives here like any other test dep.
    "agent-suite-conformance==1.0.0",
    # tests/test_wheel_install.py builds the wheel and installs it where no
    # source tree is reachable (WI-047). `--no-isolation` uses these directly,
    # so the gate needs no network.
    "build",
    "hatchling",
]
dev = [
    "mypy>=1.10",
    "types-PyYAML",
]

[project.scripts]
agent-notes             = "agent_notes.cli:main"
agent-notes-setup       = "agent_notes.scripts.setup_db:main"
agent-notes-migrate     = "agent_notes.scripts.migrate:main"
agent-notes-import-reflections = "agent_notes.scripts.import_reflections:main"
agent-notes-doctor      = "agent_notes.scripts.doctor:main"
agent-notes-bridge       = "agent_notes.bridge:main"
agent-notes-trigger-loop = "agent_notes.trigger_loop:main"
agent-notes-web          = "agent_notes.web.app:main"


[tool.uv.sources]
# regista-hraedon is published on PyPI (distribution renamed from `regista`;
# import name remains `regista`). This editable mapping overrides the published
# wheel with the local sibling checkout so `uv lock` / `uv run` and the Makefile
# targets (make lint, make test) resolve against the working tree without a
# published build per commit. Assumes the constellation layout (repos are
# siblings under a common parent, e.g. /projects/{regista,agent-notes}).
regista-hraedon = { path = "../regista", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_notes"]

[tool.hatch.build.targets.wheel.force-include]
"skills" = "agent_notes/skills"
"data/cli-manifest.json" = "agent_notes/cli-manifest.json"
# WI-047: the migration DDL must travel inside the wheel, or an artifact-only
# host can never migrate the projection database. Resolved at run time through
# importlib.resources against this exact location — see
# agent_notes/scripts/migrate.py. tests/test_wheel_install.py asserts the
# packaged set equals schema/*.sql, so a new migration that is not packaged
# fails the suite rather than the operator.
"schema" = "agent_notes/schema"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow' --strict-markers"
markers = [
    "postgres: requires a real Postgres instance (regista pg15 test DB; set REGISTA_TEST_DSN)",
    "slow: subprocess/embedding-heavy tests, skipped by default (run with -m slow)",
]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
ignore_missing_imports = true
