# SUITE.lock — agent-notes face compatibility manifest (Plan 017 WI-2.2)
#
# Records the exact versions of the suite spine (regista) and the envelope /
# workflow versions this release of agent-notes was tested against. A suite
# release is green when every component's SUITE.lock agrees and the suite-
# interop CI drives one work-item across both faces to `done` (blueprint §2.2).
#
# This is the in-repo *single source of truth for what to develop against*
# (Plan 019 B2). It must AGREE with the umbrella agent-suite/SUITE.lock
# ([components.regista] version + revision there); the umbrella is the generated
# authority and this face-local copy is vendored so agent-notes dev + CI resolve
# the spine WITHOUT cloning agent-suite. `scripts/dev-install.py` reads
# `[spine].version` and installs `regista-hraedon==<version>` from PyPI by
# default; `scripts/suite_lock.py` is the resolver. See docs/develop-against-lock.md.
#
# Regista is published to PyPI as `regista-hraedon` (import name stays `regista`).
# The pinned SHA/`describe` still records the exact commit for the local sibling
# workflow (`DEV_AGAINST=sibling`, and scripts/check_suite_lock.py).

[component]
name = "agent-notes"
version = "1.0.0"

[spine]
name = "regista"
# PyPI distribution (renamed from `regista`; import name is still `regista`).
distribution = "regista-hraedon"
repo = "hraedon/regista"
# The released PyPI version this agent-notes release develops + tests against.
# Must equal agent-suite/SUITE.lock [components.regista].version.
version = "0.5.5"
# The git SHA of regista this agent-notes release was tested against == the
# umbrella's [components.regista].revision (the v0.5.5 tag).
# Resolve the local sibling with: git -C ../regista checkout <sha>
sha = "cc8a9d3c8d140285dddb0ebdfef3d8cd3e7bb425"
describe = "v0.5.5"
# Mirrors the floor declared in pyproject.toml (the published lower bound); the
# exact version to develop against is `version` above, not this floor.
pyproject_floor = "regista>=0.5.1"

[envelope]
# Regista event-envelope + canonical-workflow versions the face writes.
# (Sourced from regista's own version surface; recorded here so a mismatch is
# detectable without standing up the full interop CI.)
envelope_version = "v5"
canonical_workflow = "v2"

[embedding]
# Pre-cache target so a work install does no model-download egress on first run
# (blueprint §4). Set HF_HOME to a persistent, pre-populated directory.
model = "nomic-ai/nomic-embed-text-v1.5"
dim = 768
cache_env = "HF_HOME"
precache_hint = "huggingface-cli download nomic-ai/nomic-embed-text-v1.5"
