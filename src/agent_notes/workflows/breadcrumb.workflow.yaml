# The agent-notes breadcrumb lifecycle, converged onto the dossier v4 canonical
# workflow (Plan 010 — Canonical lifecycle convergence). agent-notes becomes a
# face of one work-item universe: the same canonical lifecycle dossier drives,
# with the cross-lineage adversarial review gate, and lease demoted to regista
# claims (a separate axis — WI-2). The `breadcrumb` work_item_type + its custom
# fields are unchanged; only the lifecycle states/transitions converge.
#
# Canonical states (dossier v4): open / in_progress / blocked / deferred /
# in_review / in_human_review / done. `done` is terminal and reachable ONLY
# through the two-stage review (adversarial_review + human_gate), except the one
# review-exempt `close_from_open` (pre-work dismissal — won't-fix/duplicate).
#
# Review gate (regista Plan 023 dual-mode validators, registered by name):
#   - `adversarial_review` on the `in_review` exits: the reviewer must differ
#     from every author (cross-lineage), with same-lineage acknowledgment.
#   - `human_gate` on the `in_human_review` exits: **relaxed** (homelab default,
#     §0a) — `require_human: false`, so any actor (incl. the author, after an
#     independent cross-lineage adversarial pass) may accept. The mixed-chain
#     integrity guarantee (Invariant G) still holds: `done` requires the
#     adversarial pass + a distinct accepter. A workplace deployment registers
#     `strict` (`require_human: true`).
#
# `deferred` is a first-class non-terminal idle state (dossier Plan 008),
# distinct from `blocked` (external dependency). Neither carries a review gate.
#
# Lease (WI-2): `claimed` is NO LONGER a lifecycle state. claim/release/
# heartbeat go to regista's native claims primitive (acquire_claim /
# release_claim / heartbeat_claim) — a concurrency/liveness axis orthogonal to
# workflow state. "Is someone working this?" is answered by claims + the
# projection, not by `current_state`.
#
# Amend: field-only updates use the `amend` self-transition (one definition per
# non-terminal state; regista resolves by `from`). Like `comment`, it is an
# attributed event that does not change lifecycle state. `done` (terminal) cannot
# be amended directly — reopen first.
name: breadcrumb
version: 2
regista_version: "0.4.0"

states:
  - name: open
    initial: true
  - name: in_progress
  - name: blocked
  - name: deferred
  - name: in_review
  - name: in_human_review
  - name: done
    terminal: true

roles:
  - name: agent
  - name: human
  - name: system

transitions:
  # Active work -----------------------------------------------------------
  - name: start
    from: open
    to: in_progress
    allowed_roles: [agent, human, system]
  - name: start
    from: deferred
    to: in_progress
    allowed_roles: [agent, human, system]

  # Blocked (external dependency) ----------------------------------------
  - name: block
    from: in_progress
    to: blocked
    allowed_roles: [agent, human, system]
  - name: unblock
    from: blocked
    to: in_progress
    allowed_roles: [agent, human, system]

  # Deferred (deliberate park, no dependency — Plan 008) -----------------
  - name: defer
    from: open
    to: deferred
    allowed_roles: [agent, human, system]
  - name: defer
    from: in_progress
    to: deferred
    allowed_roles: [agent, human, system]
  - name: resume
    from: deferred
    to: open
    allowed_roles: [agent, human, system]

  # Two-stage review gate -------------------------------------------------
  # Stage 1: cross-lineage adversarial pass.
  - name: submit_for_review
    from: in_progress
    to: in_review
    allowed_roles: [agent, human, system]
  - name: adversarial_pass
    from: in_review
    to: in_human_review
    allowed_roles: [agent, human, system]
    validator: adversarial_review
  - name: request_changes
    from: in_review
    to: in_progress
    allowed_roles: [agent, human, system]
    validator: adversarial_review
  # Stage 2: final acceptance (relaxed — any actor may accept after the
  # independent adversarial pass; the validator enforces distinct accepter).
  - name: accept
    from: in_human_review
    to: done
    allowed_roles: [agent, human, system]
    validator: human_gate
    validator_params:
      require_human: false
  - name: reject
    from: in_human_review
    to: in_progress
    allowed_roles: [agent, human, system]
    validator: human_gate
    validator_params:
      require_human: false

  # Reopen a completed item.
  - name: reopen
    from: done
    to: open
    allowed_roles: [agent, human, system]

  # The ONE review-exempt path: dismiss before any work (won't-fix/duplicate).
  - name: close_from_open
    from: open
    to: done
    allowed_roles: [agent, human, system]

  # Amend: field-only self-transitions (non-state events). One per non-terminal
  # state; regista resolves `amend` by the work-item's current `from` state.
  - name: amend
    from: open
    to: open
    allowed_roles: [agent, human, system]
  - name: amend
    from: in_progress
    to: in_progress
    allowed_roles: [agent, human, system]
  - name: amend
    from: blocked
    to: blocked
    allowed_roles: [agent, human, system]
  - name: amend
    from: deferred
    to: deferred
    allowed_roles: [agent, human, system]
  - name: amend
    from: in_review
    to: in_review
    allowed_roles: [agent, human, system]
  - name: amend
    from: in_human_review
    to: in_human_review
    allowed_roles: [agent, human, system]

work_item_types:
  - name: breadcrumb
    custom_fields:
      - name: title
        type: string
        required: true
        ui_visible: true
      - name: description
        type: string
        required: false
        ui_visible: true
      - name: severity
        type: enum
        enum_values: [low, medium, high, urgent]
        default: medium
        ui_visible: true
      - name: kind
        type: enum
        enum_values:
          - todo
          - observation
          - decision
          - risk
          - task
          - bug
          - feature
          - improvement
          - question
          - experiment
          - spike
          - refactor
          - docs
          - ci
          - job
        default: todo
        ui_visible: true
      - name: external_refs
        type: json
        required: false
        ui_visible: true
      - name: diagnostic_keys
        type: json
        required: false
        ui_visible: true
      - name: source_identifier
        type: string
        required: false
        ui_visible: true
