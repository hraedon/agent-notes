name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # The test suite embeds with sentence-transformers (nomic-embed-text-v1.5).
      # Cache the downloaded model so only the first run pays the ~500MB cost.
      - name: Cache HuggingFace models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-nomic-embed-text-v1.5

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # regista-hraedon is published on PyPI (renamed distribution;
          # the import name is still `regista`). Pinned to 0.5.1.
          pip install "regista-hraedon==0.5.1"
          # ruff is not in the [test] extra; install it for the lint step.
          pip install ruff
          pip install -e ".[test]"

      - name: Lint
        run: ruff check src/ tests/

      # Postgres comes from testcontainers (Docker is preinstalled on ubuntu runners),
      # so no service block is needed here.
      - name: Test
        run: pytest tests/ -v

  # Pre-publication gate (Plan 017 WI-4.3 / blueprint §3): fail if forbidden
  # work-domain / personal identifiers reappear in tracked files. The denylist is
  # never committed — it comes from the AGENT_NOTES_FORBIDDEN_IDENTIFIERS
  # repository secret (borrowed from the gpo-lens gate pattern). The script exits
  # 0 when the secret is unset, so the gate is a no-op until it is configured.
  identifier-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Check for committed work-domain identifiers
        env:
          AGENT_NOTES_FORBIDDEN_IDENTIFIERS: ${{ secrets.AGENT_NOTES_FORBIDDEN_IDENTIFIERS }}
        run: python3 scripts/check_committed_identifiers.py

  # Plan 003 WI-5.1 — prove agent-notes imports and unit tests pass on native
  # Windows. Postgres-dependent tests (testcontainers) skip cleanly when Docker
  # is unavailable; unit tests (config, outbox, secrets, lifecycle, etc.) run
  # without a DB.
  windows-test:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "regista-hraedon==0.5.1"
          pip install ruff
          pip install -e ".[test]"

      - name: Lint
        run: ruff check src/ tests/

      - name: Test
        run: pytest --tb=short -q
