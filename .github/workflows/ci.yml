name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # The test suite embeds with sentence-transformers (nomic-embed-text-v1.5).
      # Cache the downloaded model so only the first run pays the ~500MB cost.
      - name: Cache HuggingFace models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-nomic-embed-text-v1.5

      # A plain editable install (Plan 026 D3 dropped regista and SUITE.lock).
      # The conformance kit (agent-suite-conformance, Plan 019 B1) comes from
      # the [test] extra. ruff is pinned to a range so a new release can't turn
      # CI red on unchanged code.
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install "ruff>=0.5,<0.16" -e ".[test]"

      - name: Lint
        run: ruff check src/ tests/

      # Typing gate (Sol P0-6 / WI-045): mypy runs in baseline mode while the
      # error backlog is burned down (137 -> 124 so far; the func-returns-value
      # class is fully cleared). Remove continue-on-error and the baseline
      # exemption once the error count reaches zero. The config lives in
      # pyproject.toml [tool.mypy].
      - name: Typecheck (mypy baseline — burn-down in progress)
        continue-on-error: true
        run: pip install mypy types-PyYAML && mypy src/agent_notes/ --no-error-summary

      # Postgres comes from testcontainers (Docker is preinstalled on ubuntu runners),
      # so no service block is needed here.
      - name: Test
        run: pytest tests/ -v

  # Pre-publication gate (Plan 017 WI-4.3 / blueprint §3): fail if forbidden
  # work-domain / personal identifiers reappear in tracked files. The denylist is
  # never committed — it comes from the AGENT_NOTES_FORBIDDEN_IDENTIFIERS
  # repository secret (borrowed from the gpo-lens gate pattern). The script exits
  # 0 when the secret is unset, so the gate is a no-op until it is configured.
  identifier-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # gate walks history when publication.toml is absent; refuses shallow
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Check for committed work-domain identifiers
        env:
          AGENT_NOTES_FORBIDDEN_IDENTIFIERS: ${{ secrets.AGENT_NOTES_FORBIDDEN_IDENTIFIERS }}
        run: python3 scripts/check_committed_identifiers.py

  # Plan 003 WI-5.1 — prove agent-notes imports and unit tests pass on native
  # Windows. Postgres-dependent tests (testcontainers) skip cleanly when Docker
  # is unavailable; unit tests (config, lifecycle, etc.) run
  # without a DB.
  windows-test:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install "ruff>=0.5,<0.16" -e ".[test]"

      - name: Lint
        run: ruff check src/ tests/

      - name: Test
        run: pytest --tb=short -q
